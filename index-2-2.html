 case 'p':{const f=!RP[id];if(f)RP[id]={m:rpMesh(lbl(id)),x:m.x,z:m.z,y:m.y,tx:0,tz:0,ty:0};const r=RP[id];const nw=performance.now()/1000;if(!f&&r.rt){const d=nw-r.rt;let vx=(m.x-r.tx)/d,vz=(m.z-r.tz)/d;if(d<.02||d>.5||Math.hypot(vx,vz)>7)vx=vz=0;r.vx=vx;r.vz=vz}else{r.vx=r.vz=0}r.rt=nw;r.tx=m.x;r.tz=m.z;r.ty=m.y;r.ts=m.s||0;r.fn=m.n|0;r.te=m.e|0;if(f){r.x=m.x;r.z=m.z;r.y=m.y}if(from)bc({t:'p',id,x:m.x,z:m.z,y:m.y,s:m.s,n:m.n,e:m.e},from);break}
 case 'door':SD.open=m.o;sfx(140,60,.5,.12,'sawtooth');if(from)bc(m,from);break;
 case 'exit':if(NET.host&&!gh.on&&BS.ph===0&&!bsPend&&from&&!PS[from.peer]&&(mode==='play'||mode==='down'||mode==='scare'||mode==='pull'||mode==='bg'||mode==='kick'))hostNext();break;
 case 'kill':if(NET.host&&from&&m.k===3&&!PS[from.peer]&&mode!=='dead')caught({id:from.peer},null,3);break;
 case 'rev':if(NET.host&&from&&!PS[from.peer]&&PS[m.id]===1)hostRevive(m.id);break;
 case 'down':applyDown(m.id,m.k);break;
 case 'up':applyUp(m.id);break;
 case 'cl':cl.st=m.st;cl.x=m.x;cl.z=m.z;cl.ry=m.r;cl.n=m.n;break;
 case 'clv':if(NET.host&&from&&!PS[from.peer])clAct(from.peer);break;
 case 'gone':if(RP[m.id]){S.remove(RP[m.id].m);delete RP[m.id]}delete DN[m.id];break;
 case 'hello':if(from&&NET.host){from.nm=cleanName(m.n);sendRoster()}break;
 case 'n':NET.n=m.n;NET.names=(m.l&&typeof m.l==='object')?m.l:{};applyNames();upN();break;
 case 'start':NET.idx=m.idx;startFloor=m.f|0;begin();break;
 case 'sk':if(NET.host&&mode==='intro'&&from)skAdd(from.peer);break;
 case 'skv':if(mode==='intro')skLabel(m.c,m.nd);break;
 case 'skgo':skipIntro();break;
 case 'round':found=m.f;if(m.w){ds=0;for(const k in DN)delete DN[k];applyNames();if(mode==='kick'||mode==='scare'||mode==='pull'||mode==='down')mode='play';$('fade').style.opacity=0;$('prompt').textContent='';last=performance.now()}newRound(false,m.s,m.d);if(m.w)toast('วาร์ปไปชั้น '+(found+1));break;
 case 'next':if(mode==='dead'||mode==='lobby'||mode==='spec')break;if(ds||mode==='pull')eliminate();else if(mode==='play'||mode==='kick')finish();break;
 case 'g':if(mode!=='dead'){GH.visible=m.v;GH.position.x=m.x;GH.position.z=m.z;GH.rotation.y=m.r;GH.scale.setScalar(m.s)}break;
 case 'gs':blackT=1;roar();break;
 case 'kn':kn2();break;
 case 'over':{const me=m.w===myId();die(me&&m.k!==3,m.k===2?GW:m.k===5?BO:m.k===6?PO:GH,me?(m.k===3?'ถูกดึงเข้าไปในประตูหลอก…':'คุณถูกจับได้…'):'ไม่มีใครรอด…',[2,3,5,6].includes(m.k)?m.k:1);break}
 case 'ws':runWarn();break;
 case 'pl':PO.position.x=m.x;PO.position.z=m.z;PO.rotation.y=m.r;pc=m.c;break
 case 'bo':{if(mode==='lobby'||mode==='dead')break;BO.visible=m.v;BO.position.x=m.x;BO.position.z=m.z;BS.tm=m.tm;const ch=m.ph!==BS.ph||m.rd!==BS.rd;BS.ph=m.ph;BS.rd=m.rd;if(m.cn!==BS.cn){BS.cn=m.cn;toast('จับได้แล้ว!',900);sfx(600,1500,.25,.14,'sine')}if(ch)bossFx();break}
 case 'w':if(mode!=='dead'){GW.visible=m.v;GW.position.x=m.x;GW.position.z=m.z;GW.rotation.y=m.r}break;
 case 'gin':gh.in=!!m.v;if(m.v){toast('มันทะลุประตูเข้ามาในห้อง… อยู่นิ่งๆ!',2800);startBreak()}break;

 case 'stun':if(m.id===myId())stun2();break;
 case 'pk':netPk(m.n);if(from)bc(m,from);break;
 case 'pp':netPp(m.i);if(from)bc(m,from);break;
 case 'fk':netFk();if(from)bc(m,from);break;
 case 'fs':netFs(m);break;

 case 'fa':if(NET.host)finAlert(from?from.peer:'H');break;
 case 'full':netClose();mpShow(2);mpSt('ห้องเต็มหรือเริ่มเล่นไปแล้ว');break}}
